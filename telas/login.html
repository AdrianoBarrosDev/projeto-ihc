<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SIGA - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Poppins" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="login.css">
</head>
<body>
   <div class="login">
        <div class="login-msg">
            <div class="logo">SIGA</div>
            <div class="msg">Bem vindo ao SIGA, entre no nosso sistema com o login dado pela empresa!</div>
        </div>
        <div class="login-inputs">
            <div class="txt-entrar">Entrar no SIGA</div>
            <div class="campo">
                <label class="txt">usuário</label>
                <input class="input-login form-control" type="text">
            </div>
            <div class="campo">
                <label class="txt">senha</label>
                <div class="senha-box">
                    <input class="input-login form-control" type="password" id="senha">
                    <button type="button" class="btn-olho" id="btnOlho">
                        <i class="bi bi-eye" id="iconeOlho"></i>
                    </button>
                </div>
                <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ" target="_blank" class="txt esqueci">esqueci a senha</a>
            </div>
            <a href="painelGeral.html"><input class="btn-entrar" type="button" value="Entrar"></a>
        </div>
    </div>
    </div>
    <script>
    const senha = document.getElementById('senha');
    const btnOlho = document.getElementById('btnOlho');
    const iconeOlho = document.getElementById('iconeOlho');

    btnOlho.addEventListener('click', function() {
        if (senha.type === 'password') {
            senha.type = 'text';
            iconeOlho.className = 'bi bi-eye-slash';
        } else {
            senha.type = 'password';
            iconeOlho.className = 'bi bi-eye';
        }
    });
</script>
</body>
</html>
