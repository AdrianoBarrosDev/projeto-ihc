<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SIGA - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Poppins" rel="stylesheet">
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="login">
        <div class="row g-0">
            <div class="login-msg col-12 col-md-4">
                <div class="logo">SIGA</div>
                <div class="msg">Bem vindo ao SIGA, entre no nosso sistema com o login dado pela empresa!</div>
            </div>
            <div class="login-inputs col-12 col-md-8">
                <div class="txt-entrar">Entrar no SIGA</div>
                <div class="campo">
                    <label class="txt">usuário</label>
                    <input class="input-login form-control" type="text">
                </div>
                <div class="campo">
                    <label class="txt">senha</label>
                    <input class="input-login form-control" type="password">
                    <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ" target="_blank" class="txt esqueci">esqueci a senha</a>
                </div>
                <a href="painelGeral.html"><input class="btn-entrar" type="button" value="Entrar"></a>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
